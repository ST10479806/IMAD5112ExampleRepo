name: kotlin Build

on:
  push:
  branches: [ main ]

  jobs:
    build:
     run-on: ubutu-latest

     steps:
     - uses: actions/checkout@v3
     - name: Set up JDK 17
     uses: actions/setup-java@v3
       with
       java-vrsion: '17'
       distribution: 'temurin'
       -name: Build with Gradle 
       run: ./gradlew build

       working-directory: IMAD5112ExampleRepo
